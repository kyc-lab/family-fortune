<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 가족 운세</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FFE58A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1A12" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* VOICE: 다정하고 또박또박, 부모님도 편한 큰 글씨
   IDEA: 노란 햇살 아래 펼쳐 보는 운세 수첩
   PICTURE: 오늘의 운세 카드, 타로는 뒤집히는 카드
   COLOUR and TYPE: 햇살 노랑 + 숲 초록, Jua 제목 + Noto Sans KR 본문
   LAYOUT: 한 줄에 하나씩, 큰 버튼, 폰 한 칸 너비 */
:root{color-scheme:light dark;
--bg:light-dark(#FFFBEA,#1E1A12);--ink:light-dark(#2F2A1F,#F6EED8);--muted:light-dark(#5E5440,#C9BC9A);
--sun:light-dark(#FFE58A,#4A3D12);--surface:light-dark(#FFFFFF,#2A2418);--line:light-dark(#F2DE9A,#4A3F26);
--tint:light-dark(#FFF1BF,#3A3018);--accent:light-dark(#3F6B2A,#8FC46F);--onaccent:light-dark(#FFFFFF,#12200B);
--han:light-dark(#7A5A00,#F2CF63);--back:light-dark(#2E2410,#0E0B06)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;word-break:keep-all;background:var(--bg);color:var(--ink);font:20px/1.6 'Noto Sans KR',sans-serif;overflow-x:clip}
#app{max-width:480px;margin:0 auto;padding:24px 20px 40px;display:flex;flex-direction:column;gap:18px;min-height:100vh}
h1,h2,h3{font-family:'Jua',sans-serif;font-weight:400;margin:0;line-height:1.3}
h1{font-size:32px;text-wrap:balance}h2{font-size:26px}h3{font-size:22px}
p{margin:0}.muted{color:var(--muted);font-size:18px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sun{background:var(--sun);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px}
.box{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.main{min-height:56px;border:0;border-radius:28px;background:var(--accent);color:var(--onaccent);font-weight:700;font-size:20px;padding:0 22px}
.sub{min-height:52px;border:2px solid var(--line);border-radius:26px;background:var(--surface);font-size:19px;padding:0 20px}
.row{min-height:72px;border:2px solid var(--line);border-radius:18px;background:var(--surface);font-size:22px;font-weight:700;display:flex;align-items:center;gap:16px;padding:0 18px;text-align:left;width:100%}
.row .t{flex-grow:1}.row .go{color:var(--muted)}
.han{width:44px;height:44px;flex:none;border-radius:12px;background:var(--tint);color:var(--han);display:flex;align-items:center;justify-content:center;font-size:22px}
.top{display:flex;align-items:center;gap:8px}
.backbtn{min-width:52px;min-height:52px;border:0;border-radius:26px;background:var(--tint);font-size:26px;line-height:1}
label{display:flex;flex-direction:column;gap:6px;font-weight:700}
input[type=text],input[type=date],input[type=password],select{min-height:56px;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:0 14px;font-size:20px;font-weight:400;width:100%}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg button{min-height:56px;border:2px solid var(--line);border-radius:14px;background:var(--surface);font-size:20px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
.ymd{border:0;padding:0;margin:0;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);gap:8px}.ymd legend{font-weight:700;padding:0;margin-bottom:6px}.ymd select{padding:0 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.check{flex-direction:row;align-items:center;gap:10px;font-weight:400}
.check input{width:26px;height:26px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px}
.facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:700}
.note{font-size:17px;color:var(--muted)}
.warn{background:var(--tint);border-radius:14px;padding:12px 14px;font-size:17px}
.spread{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.card{width:104px;height:178px;display:block;perspective:900px;border:0;padding:0;background:none}
.one .card{width:180px;height:290px}.one .front .nm{font-size:20px}
.inner{display:block;position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.card.open .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center}
.backface{background:var(--back);border:4px solid var(--han);color:var(--han);font-size:34px}
.front{background:var(--surface);border:3px solid var(--han);transform:rotateY(180deg)}
.front{padding:6px;gap:4px;justify-content:flex-start}.art{display:block;width:100%;flex:1;border-radius:8px;overflow:hidden;min-height:0}.art svg{display:block;width:100%;height:100%}.front.rev .art svg{transform:rotate(180deg)}
.front .nm{word-break:keep-all;font-family:'Jua',sans-serif;font-size:14px;line-height:1.25}
.front.rev .nm{color:var(--accent)}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.gal figure{margin:0;background:var(--surface);border:2px solid var(--han);border-radius:10px;padding:5px;text-align:center;font-size:14px;font-family:'Jua',sans-serif}.gal svg{display:block;width:100%;height:auto;border-radius:6px;margin-bottom:3px}
.pos{font-size:16px;color:var(--muted);text-align:center;margin-top:6px}
.lead{font-size:22px;font-weight:700;line-height:1.5}
.sec{display:flex;flex-direction:column;gap:2px;border-top:2px dashed var(--line);padding-top:12px}
.sec h4{margin:0;font-family:'Jua',sans-serif;font-weight:400;font-size:21px;color:var(--han)}
.sun .note{color:var(--ink)}
details summary{cursor:pointer;font-size:18px;color:var(--muted);min-height:44px;display:flex;align-items:center;gap:8px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'▸';font-size:16px;transition:transform .2s}
details[open] summary::before{transform:rotate(90deg)}
.dots{display:inline-block;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.row.alt{background:var(--tint)}
.famhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dday{flex:none;border-radius:16px;padding:2px 12px;background:var(--tint);color:var(--han);font-family:'Jua',sans-serif;font-size:20px}
.dday.soon{background:var(--accent);color:var(--onaccent)}
@media(prefers-reduced-motion:reduce){.inner{transition:none}.dots{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<!-- 음력 변환: 한국천문연구원(KASI) 기준 데이터, 1000~2050년 -->
<script src="https://cdn.jsdelivr.net/npm/korean-lunar-calendar@0.4.0/dist/korean-lunar-calendar.min.js"></script>
<script>
{
const C={sky:'#CDE8F5',sun:'#F7B32B',ray:'#F2A007',night:'#2E3A6B',grass:'#8FBF5A',leaf:'#3F6B2A',skin:'#F6D2B8',brown:'#7A4A00',orange:'#E07A3F',cream:'#FFF1BF',yellow:'#FFE58A',red:'#D9534F',blue:'#5B8FD9',purple:'#8E6BBF',white:'#FFFFFF',grey:'#9AA3AD',dgrey:'#6B7480',wood:'#A0754A',ink:'#5E4300',star:'#FFD54A',field:'#DDEFC4',dawn:'#F7C59F',water:'#6FA8DC',foam:'#BFDDF5',lav:'#E6E0F2',silver:'#C9D1DA'};
const bg=c=>`<rect width="130" height="190" fill="${c}"/>`;
const starP=(x,y,r,c,rot=0)=>{let p=[];for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2+rot,rr=i%2?r*.45:r;p.push((x+Math.cos(a)*rr).toFixed(1)+','+(y+Math.sin(a)*rr).toFixed(1))}return `<polygon points="${p.join(' ')}" fill="${c}"/>`};
const dot=(x,y,r,c)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
const ln=(x1,y1,x2,y2,c,w=3)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const face=(x,y,s=1)=>`${dot(x-3.5*s,y+1*s,1.5*s,C.ink)}${dot(x+3.5*s,y+1*s,1.5*s,C.ink)}<path d="M${x-3*s} ${y+5*s} Q${x} ${y+7.5*s} ${x+3*s} ${y+5*s}" fill="none" stroke="${C.ink}" stroke-width="${1.2*s}" stroke-linecap="round"/>`;
function person(x,y,robe,hair=C.brown,s=1,legs=true){
 return `<g transform="translate(${x} ${y}) scale(${s})">${legs?ln(-6,50,-7,66,'#5E4A2E',4)+ln(6,50,7,66,'#5E4A2E',4):''}<path d="M-12 12 L12 12 L17 52 L-17 52 Z" fill="${robe}"/>${dot(0,0,10,C.skin)}<path d="M-10.5 -1 Q0 -17 10.5 -1 Q6 -6 0 -6 Q-6 -6 -10.5 -1Z" fill="${hair}"/>${face(0,0)}</g>`;
}
const crown=(x,y,w,c=C.star)=>`<path d="M${x-w/2} ${y} L${x-w/2} ${y-w*.45} L${x-w/4} ${y-w*.2} L${x} ${y-w*.55} L${x+w/4} ${y-w*.2} L${x+w/2} ${y-w*.45} L${x+w/2} ${y}Z" fill="${c}"/>`;
const sunF=(x,y,r,faceOn=true)=>{let s='';for(let i=0;i<8;i++){const a=Math.PI/4*i;s+=ln(x+Math.cos(a)*(r+5),y+Math.sin(a)*(r+5),x+Math.cos(a)*(r+13),y+Math.sin(a)*(r+13),C.ray,4)}return s+dot(x,y,r,C.sun)+(faceOn?face(x,y,r/11):'')};
const moonC=(x,y,r,c,bgc)=>dot(x,y,r,c)+dot(x+r*.45,y-r*.2,r*.85,bgc);
const inf=(x,y)=>`<path d="M${x-12} ${y} C${x-12} ${y-8} ${x-2} ${y-8} ${x} ${y} C${x+2} ${y+8} ${x+12} ${y+8} ${x+12} ${y} C${x+12} ${y-8} ${x+2} ${y-8} ${x} ${y} C${x-2} ${y+8} ${x-12} ${y+8} ${x-12} ${y}Z" fill="none" stroke="${C.ink}" stroke-width="2.5"/>`;
const heart=(x,y,s,c)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 6 C-14 -4 -8 -14 0 -7 C8 -14 14 -4 0 6Z" fill="${c}"/>`;
const cloud=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})">${dot(-10,0,9,C.white)}${dot(0,-5,11,C.white)}${dot(11,0,9,C.white)}<rect x="-19" y="0" width="38" height="9" rx="4" fill="${C.white}"/></g>`;
const cupS=(x,y,s,c=C.orange)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M-9 -12 Q0 12 9 -12Z" fill="${c}"/><rect x="-1.5" y="-1" width="3" height="10" fill="${c}"/><rect x="-6" y="8" width="12" height="3" rx="1.5" fill="${c}"/></g>`;

const MAJOR_ART=[
// 0 바보
()=>bg(C.sky)+dot(22,23,11,C.sun)+cloud(100,30,.8)+`<path d="M0 160 L90 145 L95 190 L0 190Z" fill="${C.grass}"/><path d="M80 145 L130 125 L130 190 L90 190Z" fill="${C.wood}"/>`+ln(64,97,88,65,C.brown,3)+dot(90,61,8,C.orange)+person(55,77,C.star,C.orange)+`<path d="M44 73 Q55 57 66 73Z" fill="${C.orange}"/>`+dot(26,135,9,C.white)+dot(18,128,5,C.white)+dot(16,127,1.2,C.ink)+ln(32,141,36,148,C.white,3),
// I 마법사
()=>bg(C.cream)+`<rect y="137" width="130" height="53" fill="${C.field}"/>`+inf(65,22)+ln(75,64,96,34,C.white,5)+dot(96,34,3,C.star)+ln(54,66,40,92,C.skin,4)+person(65,52,C.red,C.ink)+`<rect x="10" y="125" width="110" height="12" rx="3" fill="${C.wood}"/><rect x="18" y="137" width="7" height="30" fill="${C.wood}"/><rect x="105" y="137" width="7" height="30" fill="${C.wood}"/>`+cupS(30,113,.8)+dot(65,117,7,C.sun)+starP(65,117,4.5,C.cream)+ln(85,121,110,110,C.grey,3)+ln(48,120,52,108,C.wood,3)+dot(30,175,5,C.red)+dot(50,180,5,C.white)+dot(80,176,5,C.red)+dot(102,181,5,C.white),
// II 여사제
()=>bg(C.night)+`<rect x="28" y="38" width="74" height="122" fill="${C.purple}"/>`+[42,58,74,90].map((x,i)=>dot(x,60+(i%2)*14,4,C.red)).join('')+`<rect x="8" y="30" width="20" height="160" fill="#3B3B4F"/><rect x="102" y="30" width="20" height="160" fill="#F4F0E6"/>`+person(65,72,C.blue,C.ink)+dot(65,56,6,C.white)+moonC(65,56,6,C.white,C.blue)+`<rect x="55" y="96" width="20" height="13" rx="2" fill="${C.white}"/>`+moonC(65,160,12,C.star,C.night)+starP(20,18,5,C.star)+starP(110,16,4,C.star),
// III 여황제
()=>bg(C.field)+`<rect width="130" height="80" fill="${C.yellow}"/>`+dot(105,25,10,C.sun)+person(65,80,'#F2A0B5',C.ink,1.15)+[50,65,80].map((x,i)=>starP(x,62-(i==1?6:0),4.5,C.star)).join('')+heart(98,128,1.1,C.red)+[12,26,40,90,104,118].map(x=>ln(x,190,x,160,C.ray,2.5)+`<ellipse cx="${x}" cy="157" rx="3.5" ry="7" fill="${C.ray}"/>`).join(''),
// IV 황제
()=>bg(C.dawn)+`<polygon points="0,125 35,70 70,125" fill="#C97B4A"/><polygon points="55,125 100,60 130,100 130,125" fill="#B3683C"/><rect y="125" width="130" height="65" fill="${C.wood}"/><rect x="28" y="58" width="74" height="104" rx="6" fill="${C.grey}"/>`+dot(32,64,9,C.dgrey)+dot(98,64,9,C.dgrey)+person(65,80,C.red,C.white)+crown(65,70,22)+ln(90,100,90,72,C.star,3)+`<circle cx="90" cy="67" r="5" fill="none" stroke="${C.star}" stroke-width="3"/>`,
// V 교황
()=>bg(C.yellow)+`<rect x="6" y="20" width="16" height="170" fill="${C.grey}"/><rect x="108" y="20" width="16" height="170" fill="${C.grey}"/><rect x="22" y="150" width="86" height="40" fill="${C.dgrey}"/>`+person(65,76,C.red,C.ink)+`<rect x="56" y="62" width="18" height="6" rx="2" fill="${C.star}"/><rect x="58" y="55" width="14" height="6" rx="2" fill="${C.star}"/><rect x="60" y="48" width="10" height="6" rx="2" fill="${C.star}"/>`+ln(92,62,92,135,C.star,3)+ln(86,70,98,70,C.star,3)+ln(87,77,97,77,C.star,3)+ln(88,84,96,84,C.star,3)+ln(48,170,78,156,C.star,3)+ln(82,170,52,156,C.star,3)+dot(46,171,4,C.star)+dot(84,171,4,C.star),
// VI 연인
()=>bg(C.sky)+sunF(65,30,12,false)+`<rect y="160" width="130" height="30" fill="${C.grass}"/>`+heart(65,82,1.6,C.red)+person(32,98,'#F2A0B5',C.ray)+person(98,98,C.blue,C.brown)+ln(12,160,12,120,C.wood,4)+dot(12,112,11,C.leaf)+ln(118,160,118,124,C.wood,4)+dot(118,116,10,C.grass)+dot(114,118,2.5,C.red)+dot(121,112,2.5,C.red),
// VII 전차
()=>bg(C.sky)+`<rect y="150" width="130" height="40" fill="${C.field}"/><rect x="30" y="40" width="70" height="9" rx="2" fill="${C.night}"/>`+[40,52,64,76,88].map(x=>dot(x,44.5,1.6,C.star)).join('')+ln(35,49,35,98,C.dgrey,3)+ln(95,49,95,98,C.dgrey,3)+person(65,72,C.blue,C.ink,1,false)+`<path d="M55 68 Q65 56 75 68Z" fill="${C.silver}"/><rect x="28" y="95" width="74" height="45" rx="4" fill="${C.grey}"/>`+starP(65,117,9,C.star)+dot(40,142,9,C.brown)+dot(90,142,9,C.brown)+`<ellipse cx="38" cy="170" rx="15" ry="8" fill="#3B3B4F"/><ellipse cx="92" cy="170" rx="15" ry="8" fill="${C.white}"/>`+dot(28,160,7,'#3B3B4F')+dot(102,160,7,C.white)+face(28,160,.6)+face(102,160,.6),
// VIII 힘
()=>bg(C.yellow)+`<rect y="160" width="130" height="30" fill="${C.grass}"/>`+inf(45,28)+`<ellipse cx="88" cy="132" rx="28" ry="16" fill="${C.sun}"/><rect x="70" y="140" width="7" height="22" rx="3" fill="${C.sun}"/><rect x="100" y="140" width="7" height="22" rx="3" fill="${C.sun}"/>`+ln(116,128,124,112,C.sun,4)+dot(70,116,18,C.orange)+dot(70,116,11,'#FBC85A')+face(70,116,1)+person(42,64,C.white,C.ray)+ln(52,86,64,108,C.skin,4)+[34,42,50].map(x=>dot(x,54,3,C.red)).join(''),
// IX 은둔자
()=>bg(C.night)+starP(20,25,4,C.star)+starP(105,18,3,C.star)+`<polygon points="0,190 65,140 130,190" fill="${C.lav}"/>`+ln(44,92,38,165,C.wood,3)+person(60,72,C.grey,C.grey)+`<path d="M46 82 L60 52 L74 82 Q60 74 46 82Z" fill="${C.dgrey}"/>`+dot(92,96,17,'#4A5585')+ln(72,88,92,88,C.skin,4)+`<rect x="86" y="90" width="12" height="16" rx="2" fill="${C.star}"/>`+starP(92,98,5,C.white),
// X 운명의 수레바퀴
()=>bg(C.sky)+cloud(22,25,.7)+cloud(108,30,.7)+cloud(22,165,.7)+cloud(108,168,.7)+dot(65,95,44,C.sun)+dot(65,95,32,C.yellow)+[0,1,2,3,4,5,6,7].map(i=>{const a=Math.PI/4*i;return ln(65+Math.cos(a)*10,95+Math.sin(a)*10,65+Math.cos(a)*42,95+Math.sin(a)*42,C.orange,3)}).join('')+dot(65,95,10,C.orange)+starP(65,95,6,C.yellow),
// XI 정의
()=>bg(C.cream)+`<rect x="6" y="20" width="16" height="170" fill="${C.grey}"/><rect x="108" y="20" width="16" height="170" fill="${C.grey}"/><rect x="22" y="28" width="86" height="122" fill="${C.purple}"/><rect y="150" width="130" height="40" fill="${C.dgrey}"/>`+person(65,74,C.red,C.ink)+crown(65,66,20)+ln(90,50,90,116,C.silver,4)+ln(84,108,96,108,C.star,3)+ln(52,100,40,100,C.skin,4)+ln(40,100,40,84,C.star,2)+ln(26,84,54,84,C.star,3)+`<path d="M20 92 Q26 102 32 92Z" fill="${C.star}"/><path d="M48 92 Q54 102 60 92Z" fill="${C.star}"/>`+ln(26,84,26,92,C.star,1.5)+ln(54,84,54,92,C.star,1.5),
// XII 매달린 사람

const LC=window.KoreanLunarCalendar?new window.KoreanLunarCalendar():null;
function toLunar(y,m,d){
 if(!LC||!LC.setSolarDate(y,m,d))return null;
 const l=LC.getLunarCalendar();return {y:l.year,m:l.month,d:l.day,leap:!!l.intercalation};
}
function toSolar(y,m,d,leap){
 if(!LC||!LC.setLunarDate(y,m,d,!!leap))return null;
 const s=LC.getSolarCalendar();return {y:s.year,m:s.month,d:s.day};
}

function birthInfo(p){
 const [y,m,d]=p.birth.split('-').map(Number);
 if(p.cal==='solar')return {solar:{y,m,d},lunar:toLunar(y,m,d)};
 return {solar:toSolar(y,m,d,p.leap),lunar:{y,m,d,leap:!!p.leap}};
}

const monthGanji=(y,m)=>{const ys=((y-4)%10+10)%10;return STEM[((ys%5)*2+2+m-1)%10]+BRANCH[(m+1)%12]};
const dayGanjiYMD=s=>dayGanji(new Date(s.y,s.m-1,s.d));

 const f=info(p);if(!f.lunar||!LC)return null;
 const Y=targetYear(), age=Y-f.lunar.y+1, m=f.lunar.m, d=f.lunar.d;
 const days=toSolar(Y,m,30,false)?30:29;
 const bday=toSolar(Y,m,Math.min(d,days),false);if(!bday)return null;
 const tae=ganji(Y), wol=monthGanji(Y,m), il=dayGanjiYMD(bday);
 const up=(age+gzNum(tae))%8||8, mid=(days+gzNum(wol))%6||6, low=(d+gzNum(il))%3||3;

   let ld=b.lunar.d,s=toSolar(Y,b.lunar.m,ld,false);if(!s){ld=29;s=toSolar(Y,b.lunar.m,29,false)}if(!s)continue;
   const dt=new Date(s.y,s.m-1,s.d);if(dt>=today)return {date:dt,age:Y-b.lunar.y,dday:Math.round((dt-today)/864e5),lunar:{y:Y,m:b.lunar.m,d:ld}};
  }
  return null;
 }
 if(!b.solar)return null;
 for(let Y=today.getFullYear();Y<=today.getFullYear()+1;Y++){
  let dt=new Date(Y,b.solar.m-1,b.solar.d);if(dt.getMonth()!==b.solar.m-1)dt=new Date(Y,b.solar.m-1,28);// 2월 29일생은 평년엔 28일
  if(dt>=today)return {date:dt,age:Y-b.solar.y,dday:Math.round((dt-today)/864e5)};
 }
 return null;
}

/* ---------- GPT 연결 ---------- */
const DEFAULT_MODEL='gpt-5-mini';
const SYS=`너는 가족 운세 앱의 풀이 작가야. 앱이 계산해 준 정보(날짜, 일진, 띠, 간지)는 정확하니 그대로 믿고, 날짜나 띠·간지를 새로 계산하거나 바꾸지 마.
말투 규칙:
- 따뜻하고 다정한 "~해요"체 존댓말로 써. "~합니다", "~습니다" 같은 딱딱한 말투는 쓰지 마. (예: "좋은 하루예요", "살펴보세요", "도와줄 거예요")
- 어르신도 읽기 쉬운 짧은 문장.
- 외래어나 어려운 한자어 대신 쉬운 우리말을 써. (예: 리스크→손해, 체크리스트→할 일 목록, 변수→걸림돌, 컨디션→몸 상태, 스트레칭→가벼운 몸풀기, 섭취→먹고 마시기)
- 안 좋은 운도 숨기지 말되 부드럽게 표현하고, 꼭 조심할 점과 대처법을 함께 말하기.
- "큰일", "재앙", "죽음", "망한다" 같은 겁주는 말은 절대 쓰지 않기.
- 건강·돈 문제는 단정하지 말고 "한 번 더 살펴보세요" 정도로.
- 마지막은 응원이나 희망적인 한마디로 마무리.
- 사람을 부를 때는 "○○님".
답은 반드시 JSON 하나로만 써: {"summary":"홈 화면에 보일 한 문장(30자 안팎)","sections":[{"title":"소제목","text":"본문 2~4문장"}]}`;
const pendingAI={}, aiErr={};
// 매일·띠별은 하루, 신년·토정비결은 한 해 동안 저장
const YEARLY=['newyear','tojeong'];
// 11~12월에는 내년 것을 기본으로 보여주고, 올해 것도 고를 수 있게
let pickYear=null;
const yearChoices=()=>{const n=new Date(),Y=n.getFullYear();return n.getMonth()>=10?[Y,Y+1]:[Y]};
const targetYear=()=>{const c=yearChoices();return c.includes(pickYear)?pickYear:c[c.length-1]};
const aiKey=kind=>YEARLY.includes(kind)?`y${targetYear()}|${kind}.m2`:`${ymdKey(new Date())}|${kind}`;
function pruneCache(){
 if(!data.cache)return;const n=new Date(),day=ymdKey(n),Y=n.getFullYear();
 for(const c in data.cache){const yr=(c.startsWith(`y${Y}|`)||c.startsWith(`y${Y+1}|`))&&c.endsWith('.m2');if(!c.startsWith(day)&&!yr)delete data.cache[c]}
}
const yearSwitch=()=>{const c=yearChoices();if(c.length<2)return '';const Y=targetYear();
 return `<div class="seg" role="group" aria-label="볼 해 고르기">${c.map(y=>`<button data-year="${y}" aria-pressed="${y===Y}">${y}년${y>new Date().getFullYear()?' (내년)':' (올해)'}</button>`).join('')}</div>`};
// 한 해에 한 번 받는 풀이라 달마다 자세히
const MONTH_GUIDE=`각 달은 짧은 문장 4~5개로 자세히 써 줘: 그 달의 전체 흐름, 좋은 점이나 기회(돈·일·건강·사람 중 그 달에 두드러지는 것), 조심할 점과 대처법, 그 달에 해 보면 좋은 작은 일 하나. 달마다 내용과 표현이 겹치지 않게. 소제목은 "1월"처럼 달 이름만.`;
function aiPrompt(kind,p){
 const n=new Date(), f=info(p), lt=lunarToday(), Y=n.getFullYear();
 const base=`이름: ${p.name}
오늘: ${Y}년 ${n.getMonth()+1}월 ${n.getDate()}일 ${DAYS[n.getDay()]}요일${lt?` (음력 ${lt.leap?'윤':''}${lt.m}월 ${lt.d}일)`:''}, 일진 ${dayGanji(n)}일
생일: ${f.solar?'양력 '+solarText(f.solar):''}${f.solar&&f.lunar?', ':''}${f.lunar?'음력 '+lunarText(f.lunar):''}
띠: ${f.animal}띠 (${f.gz}년생)
태어난 시: ${HOURS[p.hour].replace(/ \(.*/,'')}
올해: ${Y}년 ${ganji(Y)}년 (${animal(Y)}의 해), 세는 나이 ${Y-f.y+1}세`;
 if(kind==='daily')return `[매일운세]\n${base}\nsections 순서: 총운, 재물운, 건강운, 사람 관계, 조심할 점과 대처법, 응원 한마디`;
 if(kind==='zodiac')return `[띠별운세]\n${base}\n이번 달: ${n.getMonth()+1}월\n${f.animal}띠 전체의 흐름에 ${f.y}년생의 나이대를 살짝 반영해 줘.\nsections 순서: 오늘의 운세, 이번 달 운세, 조심할 점과 대처법, 응원 한마디\nsummary는 ${f.animal}띠 오늘 운세 한 문장.`;
 const T=targetYear(), target=`풀이할 해: ${T}년 ${ganji(T)}년 (${animal(T)}의 해), 그 해 세는 나이 ${T-f.y+1}세`;
 if(kind==='newyear')return `[신년운세]\n${base}\n${target}\n${T}년 한 해의 운세를 ${f.animal}띠 ${f.gz}년생인 이 사람에게 맞춰 써 줘.\nsections 순서: 한 해 총운, 재물운, 건강운, 가족과 사람 관계, 하는 일, 1월, 2월, 3월, 4월, 5월, 6월, 7월, 8월, 9월, 10월, 11월, 12월, 조심할 점과 대처법, 응원 한마디\n달은 양력 달이야. ${MONTH_GUIDE}\nsummary는 ${T}년을 한 문장으로.`;
 const t=tojeong(p);
 return `[토정비결]\n${base}\n${target}\n앱이 계산한 ${T}년 토정비결 괘: ${t.gua}번 (상괘 ${t.up}, 중괘 ${t.mid}, 하괘 ${t.low})
토정비결 원문 구절을 인용하거나 지어내지 말고, 괘 번호를 바탕으로 한 해의 흐름을 쉬운 말로 풀어 줘.
sections 순서: 한 해 총평, 1월, 2월, 3월, 4월, 5월, 6월, 7월, 8월, 9월, 10월, 11월, 12월, 응원 한마디
달은 모두 음력 달이야. ${MONTH_GUIDE}
summary는 ${T}년 토정비결을 한 문장으로.`;
}
function aiErrText(e){
 if(e instanceof TypeError)return '인터넷 연결을 확인해 주세요.';
 if(e.status===401)return 'API 키가 맞지 않아요. 설정에서 키를 다시 확인해 주세요.';
 if(e.code==='insufficient_quota')return 'API 사용 잔액이나 한도가 부족해요. OpenAI 사이트에서 확인해 주세요.';
 if(e.status===429)return '잠깐 요청이 많았어요. 조금 뒤에 다시 눌러주세요.';
 if(e.code==='model_not_found'||e.status===404)return '설정의 모델 이름을 찾을 수 없어요. 고급 설정을 확인해 주세요.';
 if(e.bad)return '풀이를 제대로 받지 못했어요. 다시 눌러주세요.';
 return '풀이를 가져오지 못했어요. 조금 뒤에 다시 눌러주세요.';
}
async function askAI(kind){
 const k=aiKey(kind), p=data.profile;
 if(!p||!data.key||pendingAI[k])return;
 pendingAI[k]=true;delete aiErr[k];
 try{
  const res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',
   headers:{'Content-Type':'application/json','Authorization':'Bearer '+data.key},
   body:JSON.stringify({model:data.model||DEFAULT_MODEL,response_format:{type:'json_object'},
    messages:[{role:'system',content:SYS},{role:'user',content:aiPrompt(kind,p)}]})});
  if(!res.ok){const j=await res.json().catch(()=>({}));throw {status:res.status,code:j.error&&j.error.code}}
  const j=await res.json();
  let out;try{out=JSON.parse(j.choices[0].message.content)}catch(_){throw {bad:true}}
  const secs=Array.isArray(out.sections)?out.sections.filter(s=>s&&typeof s.text==='string'&&s.text.trim()).map(s=>({title:String(s.title||''),text:s.text})):[];
  if(!secs.length)throw {bad:true};
  data.cache=data.cache||{};
  pruneCache();
  data.cache[k]={summary:String(out.summary||''),sections:secs};save(data);
 }catch(e){aiErr[k]=aiErrText(e)}
 finally{pendingAI[k]=false;if(['home','daily','zodiac','newyear','tojeong'].includes(view))render()}
}
const aiResult=kind=>data.cache&&data.cache[aiKey(kind)];
function ensureAI(kind){const k=aiKey(kind);if(data.key&&!aiResult(kind)&&!pendingAI[k]&&!aiErr[k])askAI(kind)}
function aiBlock(kind,title){
 const k=aiKey(kind), r=aiResult(kind);
 if(!data.key)return `<div class="sun"><h3>${title}</h3><p>설정에서 GPT API 키를 넣으면 풀이가 여기에 나와요.</p><button class="main" data-go="settings">설정으로 가기</button></div>`;
 if(r)return `<div class="sun"><h3>${title}</h3>${r.summary?`<p class="lead">${esc(r.summary)}</p>`:''}${r.sections.map(s=>`<div class="sec">${s.title?`<h4>${esc(s.title)}</h4>`:''}<p>${esc(s.text)}</p></div>`).join('')}</div>`;
 if(aiErr[k])return `<div class="sun" role="alert"><h3>${title}</h3><p>${aiErr[k]}</p><button class="main" data-ai="${kind}">다시 해보기</button></div>`;
 return `<div class="sun" role="status"><h3>${title}</h3><p>풀이를 쓰고 있어요<span class="dots">…</span></p><p class="note">처음엔 몇 초에서 수십 초 걸려요. ${YEARLY.includes(kind)?'한 번 받으면 그 해 동안은 다시 열어도':'오늘 다시 열면'} 바로 나와요.</p></div>`;
}

 return h;
}

 if(view==='zodiac'){const f=info(p);app.innerHTML=top('띠별운세')+`<div class="box"><p class="muted">${esc(p.name)}님은</p><h1>${f.animal}띠</h1></div>`+aiBlock('zodiac',`${f.animal}띠 오늘과 이번 달`)+factsBox(p);return}
 if(view==='newyear'){const Y=targetYear();app.innerHTML=top(`${Y} 신년운세`)+yearSwitch()+`<div class="box"><p class="muted">${Y}년은</p><h1>${ganji(Y)}년, ${animal(Y)}의 해</h1></div>`+aiBlock('newyear',`${esc(p.name)}님의 ${Y}년`)+factsBox(p);return}
 if(view==='tojeong'){
  const t=tojeong(p);
  if(!t){app.innerHTML=top('토정비결')+`<p class="warn" role="alert">토정비결은 음력 계산이 필요한데 불러오지 못했어요. 인터넷에 연결한 뒤 앱을 다시 열어 주세요.</p>`+factsBox(p);return}
  app.innerHTML=top(`${t.Y} 토정비결`)+yearSwitch()+`<div class="box"><p class="muted">${esc(p.name)}님의 ${t.Y}년 괘</p><h1>${t.gua}괘</h1><p class="muted">상괘 ${t.up} · 중괘 ${t.mid} · 하괘 ${t.low}</p>
  <details><summary>어떻게 계산했나요</summary><dl class="facts">
   <dt>상괘 ${t.up}</dt><dd>나이 ${t.age}세 + 태세수 ${gzNum(t.tae)} (${t.tae}년) → 8로 나눈 나머지</dd>
   <dt>중괘 ${t.mid}</dt><dd>${t.Y}년 음력 ${t.m}월 ${t.days}일 (${t.days===30?'큰달':'작은달'}) + 월건수 ${gzNum(t.wol)} (${t.wol}월) → 6으로 나눈 나머지</dd>
   <dt>하괘 ${t.low}</dt><dd>생일 ${t.d}일 + 일진수 ${gzNum(t.il)} (${t.Y}년 생일 ${t.bday.y}.${t.bday.m}.${t.bday.d} ${t.il}일) → 3으로 나눈 나머지</dd>
  </dl><p class="note">나머지가 0이면 나누는 수(8·6·3)로 쳐요. 태세수·월건수·일진수는 선천수로 셈해요.</p></details></div>`
  +aiBlock('tojeong','괘 풀이 (음력 열두 달)')+factsBox(p);return}
 if(view==='tarot'){
  if(!tarot){app.innerHTML=top('타로')+`<div class="sun"><h3>마음속으로 궁금한 것을 떠올려 보세요</h3><p>준비되면 카드를 뽑아요.</p></div>
   <button class="main" data-draw="1">오늘의 한 장 뽑기</button><button class="sub" data-draw="3">세 장 뽑기 (과거 · 현재 · 미래)</button><button class="sub" data-go="gallery">카드 78장 모두 보기</button>`;return}
  const pos=tarot.length===3?['과거','현재','미래']:['오늘의 카드'];
  const all=tarot.every(c=>c.open);
  app.innerHTML=top('타로')+`<p class="muted" style="text-align:center">${all?'카드의 뜻을 살펴보세요':'카드를 눌러서 뒤집어 보세요'}</p>
  <div class="spread ${tarot.length===1?'one':''}">${tarot.map((c,i)=>`<div><button class="card ${c.open?'open':''}" data-flip="${i}" aria-label="${pos[i]} 카드 ${c.open?esc(c.name):'뒤집기'}"><span class="inner"><span class="face backface" aria-hidden="true">星</span><span class="face front ${c.rev?'rev':''}"><span class="art">${c.open?cardSvg(c.art()):''}</span><span class="nm">${c.label}${c.rev?' ↺':''}</span></span></span></button><p class="pos">${pos[i]}</p></div>`).join('')}</div>
  ${tarot.filter(c=>c.open).length?`<div class="box">${tarot.map((c,i)=>c.open?`<p><b>${pos[i]} · ${c.name}${c.rev?' (거꾸로)':''}</b><br>${c.rev?c.down:c.up}</p>`:'').join('')}</div>`:''}
  ${all?aiSlot('카드 해석')+'<button class="sub" data-redraw>다시 뽑기</button>':''}`;
  return;
 }
 if(view==='gallery'){app.innerHTML=`<div class="top"><button class="backbtn" data-go="tarot" aria-label="타로로 돌아가기">‹</button><h2>카드 78장</h2></div><div class="gal">${DECK.map(c=>`<figure>${cardSvg(c.art())}<figcaption>${c.label}</figcaption></figure>`).join('')}</div>`;return}
 if(view==='family'){
  const list=famSorted();
  app.innerHTML=top('가족 생일')+`<p class="muted">가까운 생일부터 보여줘요. 운세에는 쓰지 않고 이 폰에만 저장돼요.</p>`
  +(list.length?list.map(famCard).join(''):`<div class="sun"><h3>아직 등록한 가족이 없어요</h3><p>아래 버튼으로 가족 생일을 넣어 보세요.</p></div>`)
  +`<button class="main" data-famedit="new">가족 추가하기</button>`;
  return;
 }
 if(view==='famedit'){
  const d=famDraft, isNew=!(data.family||[]).some(e=>e.id===d.id);
  app.innerHTML=`<div class="top"><button class="backbtn" data-go="family" aria-label="가족 생일로 돌아가기">‹</button><h2>${isNew?'가족 추가':'가족 생일 고치기'}</h2></div>
  <label>이름 (부르는 이름)<input type="text" id="g-name" value="${esc(d.name)}" placeholder="예: 엄마, 큰아들"></label>
  <fieldset class="ymd"><legend>생년월일</legend>
   <label><span class="sr">태어난 해</span><select id="g-y"><option value="">년도</option>${yearOptions(d.birth.slice(0,4))}</select></label>
   <label><span class="sr">태어난 달</span><select id="g-m"><option value="">월</option>${range(1,12).map(m=>`<option value="${pad(m)}" ${pad(m)===d.birth.slice(5,7)?'selected':''}>${m}월</option>`).join('')}</select></label>
   <label><span class="sr">태어난 날</span><select id="g-d"><option value="">일</option>${range(1,d.cal==='lunar'?30:31).map(x=>`<option value="${pad(x)}" ${pad(x)===d.birth.slice(8,10)?'selected':''}>${x}일</option>`).join('')}</select></label>
  </fieldset>
  <div><p style="font-weight:700;margin-bottom:6px">위 생년월일은</p><div class="seg">
   <button data-gcal="solar" aria-pressed="${d.cal==='solar'}">양력</button><button data-gcal="lunar" aria-pressed="${d.cal==='lunar'}">음력</button></div></div>
  ${d.cal==='lunar'?`<label class="check"><input type="checkbox" id="g-leap" ${d.leap?'checked':''}>윤달이에요</label>`:''}
  <div><p style="font-weight:700;margin-bottom:6px">생일은 어느 날로 챙기나요?</p><div class="seg">
   <button data-gcel="solar" aria-pressed="${d.celebrate==='solar'}">양력으로</button><button data-gcel="lunar" aria-pressed="${d.celebrate==='lunar'}">음력으로</button></div></div>
  ${famMsg?`<p class="warn" role="alert">${famMsg}</p>`:''}
  <button class="main" id="g-save">저장하기</button>
  ${isNew?'':(famAskDel?`<div class="box"><p>${esc(d.name)}님 생일을 지울까요?</p><div class="seg"><button data-famdel="yes">지우기</button><button data-famdel="no">그만두기</button></div></div>`:`<button class="sub" data-famdel="ask">이 가족 지우기</button>`)}`;
  return;
 }
 if(view==='settings'){
  app.innerHTML=top('내 정보 · 설정')+`<div class="box"><h3>내 정보</h3><dl class="facts"><dt>이름</dt><dd>${esc(p.name)}</dd><dt>생일</dt><dd>${p.birth.replace(/^(\d+)-0?(\d+)-0?(\d+)$/,'$1년 $2월 $3일')} (${p.cal==='solar'?'양력':'음력'+(p.leap?', 윤달':'')})${(()=>{const f=info(p);return p.cal==='solar'?(f.lunar?`<br><span class="note">음력 ${lunarText(f.lunar)}</span>`:''):(f.solar?`<br><span class="note">양력 ${solarText(f.solar)}</span>`:'')})()}</dd><dt>시간</dt><dd>${esc(HOURS[p.hour]).replace(/ \(.*/,'')}</dd></dl><button class="sub" data-edit>고치기</button></div>
  <div class="box"><h3>GPT 연결 (API 키)</h3><p class="note">${data.key?'연결돼 있어요.':'아직 키가 없어요.'} 키는 이 폰에만 저장돼요. 운세를 볼 때 이름·생년월일·태어난 시가 OpenAI로 보내져요.</p>
  <label>API 키<input type="password" id="f-key" value="${esc(data.key||'')}" autocomplete="off" placeholder="sk-로 시작하는 키"></label>
  <p class="note">지금 쓰는 모델: <b>${esc(data.model||DEFAULT_MODEL)}</b></p>
  <details><summary>고급 설정 (모델 바꾸기)</summary><label>모델 이름<input type="text" id="f-model" value="${esc(data.model||'')}" placeholder="${DEFAULT_MODEL}" autocomplete="off" autocapitalize="off" spellcheck="false"></label><p class="note">비워 두면 ${DEFAULT_MODEL}을 써요.</p></details>
  <button class="main" id="f-keysave">키 저장</button>${savedMsg?`<p class="note" role="status">${savedMsg}</p>`:''}
  <p class="note">OpenAI 사이트에서 결제 한도를 정해 두면 안심이에요. 운세는 하루에 한 번만 받아서 이 폰에 저장해요.</p></div>
  <div class="box"><h3>처음부터 다시</h3>${askReset?`<p>이 폰에 저장된 정보를 모두 지울까요?</p><div class="seg"><button data-reset="yes">지우기</button><button data-reset="no">그만두기</button></div>`:`<button class="sub" data-reset="ask">모든 정보 지우기</button>`}</div>`;
 }
}

app.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.go){view=t.dataset.go;askReset=false;savedMsg='';if(view==='tarot')tarot=null;render();scrollTo(0,0);return}
 if(t.dataset.cal){keepDraft();draft.cal=t.dataset.cal;savedMsg='';render();return}
 if(t.id==='f-save'){keepDraft();
  const [by,bm,bd]=draft.birth.split('-');
  if(!draft.name.trim()||!by||!bm||!bd){savedMsg='이름과 생년월일(년·월·일)을 모두 골라주세요.';render();return}
  if(draft.cal==='solar'){const t=new Date(+by,+bm-1,+bd);if(t.getMonth()!==+bm-1){savedMsg=`${+bm}월에는 ${+bd}일이 없어요. 날짜를 다시 골라주세요.`;render();return}}
  if(draft.cal==='lunar'&&LC&&!toSolar(+by,+bm,+bd,draft.leap)){
   savedMsg=draft.leap&&!toSolar(+by,+bm,1,true)?`${+by}년에는 음력 윤${+bm}월이 없어요. "윤달이에요"를 확인해 주세요.`:`${+by}년 음력 ${draft.leap?'윤':''}${+bm}월은 29일까지예요. 날짜를 다시 골라주세요.`;render();return}
  data.profile={...draft,name:draft.name.trim()};data.cache={};for(const k in aiErr)delete aiErr[k];const ok=save(data);draft=null;
  view='home';savedMsg='';render();if(!ok)console.log('저장소를 쓸 수 없어 이번에만 기억해요');return}
 if(t.dataset.edit!==undefined){draft=null;savedMsg='';view='setup';render();return}
 if(t.dataset.famedit){
  const e=(data.family||[]).find(x=>x.id===t.dataset.famedit);
  famDraft=e?{...e}:{id:'f'+Date.now().toString(36),name:'',birth:'--',cal:'solar',leap:false,celebrate:'solar'};
  famAskDel=false;famMsg='';view='famedit';render();scrollTo(0,0);return}
 if(t.dataset.gcal){keepFam();famDraft.cal=t.dataset.gcal;famDraft.celebrate=t.dataset.gcal;famMsg='';render();return}
 if(t.dataset.gcel){keepFam();famDraft.celebrate=t.dataset.gcel;render();return}
 if(t.dataset.famdel==='ask'){keepFam();famAskDel=true;render();return}
 if(t.dataset.famdel==='no'){keepFam();famAskDel=false;render();return}
 if(t.dataset.famdel==='yes'){data.family=(data.family||[]).filter(x=>x.id!==famDraft.id);save(data);famDraft=null;view='family';render();return}
 if(t.id==='g-save'){keepFam();const d=famDraft,[by,bm,bd]=d.birth.split('-');
  if(!d.name.trim()||!by||!bm||!bd){famMsg='이름과 생년월일(년·월·일)을 모두 골라주세요.';render();return}
  if(d.cal==='solar'){const x=new Date(+by,+bm-1,+bd);if(x.getMonth()!==+bm-1){famMsg=`${+bm}월에는 ${+bd}일이 없어요. 날짜를 다시 골라주세요.`;render();return}}
  if(d.cal==='lunar'&&LC&&!toSolar(+by,+bm,+bd,d.leap)){famMsg=d.leap&&!toSolar(+by,+bm,1,true)?`${+by}년에는 음력 윤${+bm}월이 없어요. "윤달이에요"를 확인해 주세요.`:`${+by}년 음력 ${d.leap?'윤':''}${+bm}월은 29일까지예요. 날짜를 다시 골라주세요.`;render();return}
  const e={...d,name:d.name.trim()};data.family=data.family||[];
  const i=data.family.findIndex(x=>x.id===e.id);if(i<0)data.family.push(e);else data.family[i]=e;
  save(data);famDraft=null;view='family';render();scrollTo(0,0);return}
 if(t.dataset.year){pickYear=Number(t.dataset.year);render();return}
 if(t.dataset.ai){delete aiErr[aiKey(t.dataset.ai)];render();return}
 if(t.id==='f-keysave'){data.key=document.getElementById('f-key').value.trim();data.model=document.getElementById('f-model').value.trim();for(const k in aiErr)delete aiErr[k];savedMsg=save(data)?'저장했어요.':'이 화면에서는 저장이 안 돼서 이번에만 기억해요.';render();return}
 if(t.dataset.reset==='ask'){askReset=true;render();return}
 if(t.dataset.reset==='no'){askReset=false;render();return}
 if(t.dataset.reset==='yes'){data={};save(data);try{localStorage.removeItem(KEY)}catch(e){}askReset=false;draft=null;view='setup';render();return}
 if(t.dataset.draw){tarot=draw(Number(t.dataset.draw));render();return}
 if(t.dataset.flip){const i=t.dataset.flip;if(tarot[i].open)return;tarot[i].open=true;t.querySelector('.art').innerHTML=cardSvg(tarot[i].art());t.classList.add('open');
  const slow=matchMedia('(prefers-reduced-motion: reduce)').matches?0:750;
  setTimeout(()=>{render();const b=app.querySelector(`[data-flip="${i}"]`);if(b)b.focus()},slow);return}
 if(t.dataset.redraw!==undefined){tarot=null;render();return}
});
function keepFam(){
 const g=id=>document.getElementById(id);if(!famDraft||!g('g-name'))return;
 famDraft.name=g('g-name').value;famDraft.birth=[g('g-y').value,g('g-m').value,g('g-d').value].join('-');
 famDraft.leap=g('g-leap')?g('g-leap').checked:false;
}
function keepDraft(){
 const g=id=>document.getElementById(id);if(!draft)return;
 if(g('f-name'))draft.name=g('f-name').value;if(g('f-y'))draft.birth=[g('f-y').value,g('f-m').value,g('f-d').value].join('-');
 if(g('f-hour'))draft.hour=Number(g('f-hour').value);draft.leap=g('f-leap')?g('f-leap').checked:false;
}
pruneCache();
render();
}
</script>
</body>
</html>
